<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Balance Terminal</title>
<meta name="theme-color" content="#050608">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Balance">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="style.css?v=1791577162">
</head>
<body>
<div id="scroller">
<header class="top">
  <div class="updated" id="status"><span class="dot"></span><span class="lab">LAST UPDATED</span><span class="when" id="status-text">LOADING</span></div>
  <div class="menu-wrap">
    <button class="fn amber" id="btn-menu" aria-haspopup="menu" aria-expanded="false" aria-controls="menu" aria-label="Refresh and settings">⟳ REFRESH <span class="gear" aria-hidden="true">⚙</span><span class="caret">▾</span></button>
    <div class="menu" id="menu" role="menu" hidden>
      <button role="menuitem" data-act="quick"><b>Refresh <i class="tag t-quick">QUICK</i></b><span>Live prices and wallet balances. About 10 seconds.</span></button>
      <button role="menuitem" data-act="save"><b>Refresh + save sheet <i class="tag t-more">MORE</i></b><span>Same, then writes a new spreadsheet to Drive. About 20 seconds. Asks you to confirm.</span></button>
      <button role="menuitem" data-act="full"><b>Full update · Mac <i class="tag t-heavy">HEAVY</i></b><span>Cards, bank and Fidelity from Plaid, run on your Mac. 5 to 15 minutes. Asks you to confirm.</span></button>
      <hr>
      <button role="menuitem" data-act="settings" class="menu-util"><b>⚙ Settings and restore</b><span>Access key, earlier versions</span></button>
      <button role="menuitem" data-act="privacy" class="menu-util" aria-pressed="false"><b>◌ Hide $ amounts</b><span>Show it off without jinxing it. Hides every dollar figure; percentages stay.</span></button>
    </div>
  </div>
</header>

<button class="tape" id="tape-btn" type="button" aria-label="Today's prices. Tap for the time they're from."><div class="tape-in" id="tape"></div></button>

<main class="wrap">
  <section class="bar-row">
    <div class="range-wrap">
      <button class="fn range-btn" id="range-btn" type="button" aria-expanded="false" aria-controls="range-pop"><span class="lab">RANGE</span><span id="range-label">1Y</span><span class="caret">▾</span></button>
      <div class="range-pop" id="range-pop" hidden>
        <div class="seg" id="presets"><button data-p="3">3M</button><button data-p="6">6M</button><button data-p="12">1Y</button><button data-p="ytd">YTD</button><button data-p="36">3Y</button><button data-p="all">ALL</button></div>
        <div class="range-sel"><label for="from">FROM</label><select id="from"></select><label for="to">TO</label><select id="to"></select></div>
      </div>
    </div>
    <div class="jobs" id="jobs"></div>
  </section>

  <section class="kpis" id="kpis"></section>

  <div class="grid">
    <section class="panel" id="p-assets">
      <header><h2>ASSETS</h2></header>
      <div class="legend" id="lg-assets"></div>
      <div class="chart"><canvas id="c-assets"></canvas></div>
      <div class="asof" id="asof-assets"></div>
    </section>
    <section class="panel" id="p-wc">
      <header><h2>WORKING CAPITAL</h2></header>
      <div class="legend" id="lg-wc"></div>
      <div class="chart"><canvas id="c-wc"></canvas></div>
      <div class="asof" id="asof-wc"></div>
    </section>

    <section class="panel wide" id="p-inv">
      <header><h2>INVESTMENTS</h2><div class="seg sm" id="inv-mode"><button data-m="sector">BY HOLDING</button><button data-m="type">BY ACCOUNT</button></div></header>
      <div class="legend" id="lg-inv"></div>
      <div class="chart tall"><canvas id="c-inv"></canvas></div>
      <button class="expander" type="button" data-x="pos" aria-expanded="false" aria-controls="x-pos"><span>POSITIONS <span class="sub" id="pos-asof"></span></span><span class="chev">▾</span></button>
      <div class="xbody" id="x-pos" hidden><div class="tbl-wrap"><table id="pos"></table></div></div>
    </section>

    <section class="panel wide" id="p-expo">
      <header><h2>EXPOSURE</h2></header>
      <button class="donut" type="button" data-x="expo" aria-label="Show the holdings table"><canvas id="c-pie"></canvas><span class="donut-mid"><span class="lab">INVESTMENTS</span><span class="num" id="pie-total"></span><span class="hint">TAP FOR TABLE</span></span></button>
      <button class="expander" type="button" data-x="expo" aria-expanded="false" aria-controls="x-expo"><span>HOLDINGS <span class="sub" id="expo-asof"></span></span><span class="chev">▾</span></button>
      <div class="xbody" id="x-expo" hidden><div class="tbl-wrap"><table id="tbl"></table></div></div>
    </section>

    <section class="panel wide" id="p-liab">
      <header><h2>CURRENT LIABILITIES</h2><div class="seg sm" id="liab-mode"></div></header>
      <div class="legend" id="lg-liab"></div>
      <div class="chart"><canvas id="c-liab"></canvas></div>
      <div class="note" id="liab-note" hidden></div>
      <div class="asof" id="asof-liab"></div>
    </section>

    <section class="panel wide" id="p-wal">
      <header><h2>WALLETS</h2></header>
      <div class="tree" id="tree" role="button" tabindex="0" data-x="wal" aria-label="Wallet map. Tap for the table."></div>
      <button class="expander" type="button" data-x="wal" aria-expanded="false" aria-controls="x-wal"><span>WALLETS <span class="sub" id="wal-asof"></span></span><span class="chev">▾</span></button>
      <div class="xbody" id="x-wal" hidden><div class="tbl-wrap"><table id="wal"></table></div></div>
    </section>
  </div>
  <footer id="foot"></footer>
</main>

</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<dialog id="confirm">
  <div class="cf">
    <div class="cf-step" id="cf-step"></div>
    <h2 id="cf-title"></h2>
    <div class="cf-body" id="cf-body"></div>
    <div class="row"><button class="fn ghost" id="cf-cancel" type="button">CANCEL</button><button class="fn amber" id="cf-ok" type="button"></button></div>
  </div>
</dialog>

<dialog id="settings">
  <form method="dialog" id="settings-form">
    <h2>CONNECT</h2>
    <p>Paste the access key once. It stays on this device.</p>
    <label for="set-key">ACCESS KEY</label>
    <input id="set-key" type="password" autocomplete="off" spellcheck="false" placeholder="paste key">
    <label for="set-api">API URL</label>
    <input id="set-api" type="url" autocomplete="off" spellcheck="false">
    <div class="row"><button value="cancel" class="fn ghost" formnovalidate>CLOSE</button><button value="ok" class="fn amber" id="set-save">CONNECT</button></div>
  </form>
  <div class="restore">
    <h2>RESTORE AN EARLIER VERSION</h2>
    <p>Saved automatically before every full update. Restoring keeps the current version as a backup too.</p>
    <div id="versions" class="versions"><span class="sub">Loading…</span></div>
  </div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="config.js?v=1791577162"></script>
<script src="app.js?v=1791577162"></script>
</body>
</html>
