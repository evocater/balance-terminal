<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Balance Terminal</title>
<meta name="theme-color" content="#050608">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Balance">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">▮▮▯</span><span>BALANCE<b>TERM</b></span></div>
  <div class="status" id="status"><span class="dot"></span><span id="status-text">LOADING</span></div>
  <div class="clock num" id="clock"></div>
  <nav class="actions" id="actions">
    <button class="fn" id="btn-refresh" title="Live prices and on-chain balances, a few seconds"><kbd>F5</kbd>REFRESH</button>
    <button class="fn" id="btn-save" title="Refresh, then save a new spreadsheet to Drive/Finances/Auto Generated"><kbd>F6</kbd>REFRESH + SAVE SHEET</button>
    <button class="fn amber" id="btn-full" title="Queue a full update on the Mac: cards, bank and Fidelity via Plaid"><kbd>F9</kbd>FULL UPDATE · MAC</button>
    <button class="fn ghost" id="btn-settings" aria-label="Settings">⚙</button>
  </nav>
</header>

<div class="tape" aria-hidden="true"><div class="tape-in" id="tape"></div></div>

<main class="wrap">
  <section class="bar-row">
    <div class="range" role="group" aria-label="Date range">
      <div class="seg" id="presets"><button data-p="6">6M</button><button data-p="12">1Y</button><button data-p="ytd">YTD</button><button data-p="36">3Y</button><button data-p="all">ALL</button></div>
      <label for="from">FROM</label><select id="from"></select>
      <label for="to">TO</label><select id="to"></select>
    </div>
    <div class="jobs" id="jobs"></div>
  </section>

  <section class="kpis" id="kpis"></section>

  <div class="grid">
    <section class="panel">
      <header><h2>ASSETS</h2></header>
      <div class="legend" id="lg-assets"></div>
      <div class="chart"><canvas id="c-assets"></canvas></div>
    </section>
    <section class="panel">
      <header><h2>WORKING CAPITAL</h2></header>
      <div class="legend" id="lg-wc"></div>
      <div class="chart"><canvas id="c-wc"></canvas></div>
    </section>

    <section class="panel wide">
      <header><h2>INVESTMENTS</h2><div class="seg sm" id="inv-mode"><button data-m="sector">BY HOLDING</button><button data-m="type">BY ACCOUNT</button></div></header>
      <div class="legend" id="lg-inv"></div>
      <div class="chart tall"><canvas id="c-inv"></canvas></div>
    </section>

    <section class="panel wide">
      <header><h2>EXPOSURE <span class="sub" id="tbl-month"></span></h2></header>
      <div class="expo">
        <div class="donut"><canvas id="c-pie"></canvas><div class="donut-mid"><span class="lab">INVESTMENTS</span><span class="num" id="pie-total"></span></div></div>
        <div class="tbl-wrap"><table id="tbl"></table></div>
      </div>
    </section>

    <section class="panel wide">
      <header><h2>POSITIONS <span class="sub" id="pos-asof"></span></h2></header>
      <div class="tbl-wrap"><table id="pos"></table></div>
    </section>

    <section class="panel wide">
      <header><h2>CURRENT LIABILITIES</h2><div class="seg sm" id="liab-mode"></div></header>
      <div class="legend" id="lg-liab"></div>
      <div class="chart"><canvas id="c-liab"></canvas></div>
      <div class="note" id="liab-note" hidden></div>
    </section>

    <section class="panel wide">
      <header><h2>WALLETS <span class="sub" id="wal-asof"></span></h2></header>
      <div class="tbl-wrap"><table id="wal"></table></div>
    </section>
  </div>
  <footer id="foot"></footer>
</main>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<dialog id="settings">
  <form method="dialog" id="settings-form">
    <h2>CONNECT</h2>
    <p>Paste the access key once. It stays on this device.</p>
    <label for="set-key">ACCESS KEY</label>
    <input id="set-key" type="password" autocomplete="off" spellcheck="false" placeholder="paste key">
    <label for="set-api">API URL</label>
    <input id="set-api" type="url" autocomplete="off" spellcheck="false">
    <div class="row"><button value="cancel" class="fn ghost" formnovalidate>CANCEL</button><button value="ok" class="fn amber" id="set-save">CONNECT</button></div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
